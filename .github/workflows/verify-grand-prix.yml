name: Verify SAIKO World Grand Prix
on:
  push:
    branches: [saiko-world-grand-prix]
    paths:
      - 'index.html'
      - 'game-v3.js'
      - 'game-v4.js'
      - 'avatar.html'
      - 'avatar-stage.js'
      - 'avatar-stage.css'
      - 'game-v3.css'
      - 'game-v4.css'
      - 'new-game.html'
      - 'studio.html'
      - 'functions/**'
      - 'wrangler.toml'
      - 'qa/**'
      - '.github/workflows/verify-grand-prix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax and game rules
        run: node --test qa/studio.test.mjs qa/director.test.mjs qa/v4.test.mjs qa/partner.test.mjs qa/avatar.test.mjs
      - name: Verify published Cloudflare Pages contains latest changes
        run: node qa/live-deploy.mjs
      - name: Verify published game studio and Workers AI endpoint
        run: node qa/studio-live.mjs
      - name: Verify cute-game preview and Cloudflare staff conversation
        run: node qa/v4-live.mjs
