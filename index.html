<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>サイ校プロジェクト岩国 出演者パスメーカー</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f4f6fb;color:#111827}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .boot-card{width:min(560px,100%);background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.12);padding:32px;text-align:center}
    .boot-title{font-size:clamp(22px,5vw,32px);font-weight:800;margin:0 0 14px}
    .boot-msg{color:#64748b;line-height:1.8;margin:0}
    .spinner{width:44px;height:44px;margin:24px auto;border:5px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite}
    .error{color:#b91c1c;white-space:pre-wrap;text-align:left;background:#fef2f2;border-radius:12px;padding:14px;margin-top:18px;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <h1 class="boot-title">サイ校プロジェクト岩国<br>出演者パスメーカー</h1>
      <div class="spinner" id="spinner"></div>
      <p class="boot-msg" id="boot-msg">名札メーカーを読み込んでいます…</p>
      <div class="error" id="boot-error"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script>
  (async()=>{
    const msg=document.getElementById('boot-msg');
    const errBox=document.getElementById('boot-error');
    const spinner=document.getElementById('spinner');
    try{
      if(!window.fflate) throw new Error('展開ライブラリを読み込めませんでした。');
      msg.textContent='デザインデータを準備しています…';
      const res=await fetch('./app.zip?v=20260820',{cache:'no-store'});
      if(!res.ok) throw new Error('アプリデータを取得できませんでした（'+res.status+'）。');
      const zipBytes=new Uint8Array(await res.arrayBuffer());
      const files=window.fflate.unzipSync(zipBytes);
      const decoder=new TextDecoder('utf-8');
      const get=(suffix)=>{
        const key=Object.keys(files).find(k=>k.endsWith('/'+suffix)||k===suffix);
        if(!key) throw new Error(suffix+' が見つかりません。');
        return decoder.decode(files[key]);
      };

      const sourceHtml=get('index.html');
      const css=get('style.css');
      const themes=get('themes.js');
      let app=get('app.js');

      msg.textContent='画面を組み立てています…';
      const parsed=new DOMParser().parseFromString(sourceHtml,'text/html');
      parsed.querySelectorAll('script').forEach(el=>el.remove());
      document.title=parsed.title||document.title;

      const style=document.createElement('style');
      style.textContent=css;
      document.head.appendChild(style);
      document.body.innerHTML=parsed.body.innerHTML;

      // ZIP内の元アプリはローカル起動時にDOMContentLoadedを待つ構成。
      // Webローダーでは読み込み完了済みなので、その場でinit()を呼ぶ。
      app=app.replace(/document\.addEventListener\(['\"]DOMContentLoaded['\"],\s*init\s*\);?/,'init();');

      new Function(themes)();
      new Function(app)();
    }catch(error){
      console.error(error);
      spinner.style.display='none';
      msg.textContent='読み込みに失敗しました。';
      errBox.style.display='block';
      errBox.textContent=String(error&&error.message?error.message:error)+'\n\nページを再読み込みしてください。';
    }
  })();
  </script>
</body>
</html>
