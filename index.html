<script>
(()=>{'use strict';
const KEY='saiko-world-cup-v2';
const STAGES=[

const prompts={

};
const courtCases=[
 {title:'唐揚げレモン強制事件',charge:'「唐揚げに無断でレモンをかける行為」は有罪か？',pro:'誰の許可もなく味を変えた！',def:'美味しく食べてもらう善意だった！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'衝撃の新証拠！レモンをかけた本人は、唐揚げを食べていなかった！'},
 {title:'最後のプリン失踪事件',charge:'冷蔵庫の最後のプリンを食べた人は有罪か？',pro:'名前が書いてなくても最後の1個を取るのは悪い！',def:'賞味期限を守るための勇敢な行動だった！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'プリンのフタには……『ご自由にどうぞ』のシールが！'},
 {title:'エアコン温度戦争事件',charge:'全員に断らず冷房を1℃変える行為は有罪か？',pro:'みんなの快適さを独断で奪った！',def:'地球環境と電気代を守るためだった！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'事件当日の室温は……実は30℃だった！'},
 {title:'カレー完全混合事件',charge:'カレーとご飯を最初から全部混ぜるのは有罪か？',pro:'美しい盛り付けが一瞬で消えた！',def:'一口ごとの味を平等にするためだ！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'目撃者は『おかわりも全部混ぜていた』と証言！'},
 {title:'エレベーター連打事件',charge:'「閉」ボタンを10連打する行為は有罪か？',pro:'ボタンが気の毒すぎる！',def:'みんなの時間を守ろうとしただけ！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'現場の映像では……押した瞬間にドアは既に閉まり始めていた！'},
 {title:'ラーメンスープ一滴事件',charge:'ラーメンのスープを一滴残して完食宣言するのは有罪か？',pro:'一滴も残さず飲み切るべきだ！',def:'健康と満足感の絶妙なバランスだ！',rule:'検察と弁護が60秒ずつ弁論、判決は20秒。',evidence:'驚くべき新証拠！器には……麺が一本だけ残っていた！'}
];
const base=()=>({names:['チーム・バナナ','チーム・パンダ','チーム・カッパ'],stage:0,prompt:{},awards:{},ranks:{},courtWinners:Array(6).fill(null),evidenceShown:Array(6).fill(false),muted:false,showHelp:false});
let s;try{s={...base(),...JSON.parse(localStorage.getItem(KEY)||'{}')};if(!Array.isArray(s.names)||s.names.length!==3||!Number.isInteger(s.stage))s=base();if(!Array.isArray(s.courtWinners)||s.courtWinners.length!==courtCases.length)s.courtWinners=Array(courtCases.length).fill(null);if(!Array.isArray(s.evidenceShown)||s.evidenceShown.length!==courtCases.length)s.evidenceShown=Array(courtCases.length).fill(false);}catch(e){s=base()};
let timer={remaining:0,seconds:60,running:false,deadline:0,handle:null};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const h=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=()=>STAGES[Math.max(0,Math.min(STAGES.length-1,s.stage))];
const points=()=>s.names.map((_,i)=>Object.values(s.awards||{}).reduce((sum,v)=>sum+(Array.isArray(v)?Number(v[i]||0):0),0));
const order=()=>points().map((v,i)=>({i,v,name:s.names[i]})).sort((a,b)=>b.v-a.v||a.i-b.i);
const promptIndex=id=>Math.min(Math.max(0,s.prompt?.[id]||0),(prompts[id]||[['']]).length-1);
function sound(freq=660,time=.11,type='sine'){if(s.muted)return;try{const Audio=window.AudioContext||window.webkitAudioContext;const c=new Audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+time);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+time);setTimeout(()=>c.close(),time*1000+110)}catch(e){}}
function fanfare(){[0,180,390,570].forEach((ms,i)=>setTimeout(()=>sound([523,659,783,1047][i],.22,'triangle'),ms));if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<80;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#d7ff41','#ff7497','#80d9e7','#ffc77b'][i%4];c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
function resetTimer(sec=stage().timer||60){timer.running=false;if(timer.handle)clearInterval(timer.handle);timer.handle=null;timer.seconds=sec;timer.remaining=sec*1000;updateTimer()}
function updateTimer(){const display=document.getElementById('timerDigits');if(!display)return;let sec=Math.ceil(Math.max(0,timer.remaining)/1000);display.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');display.classList.toggle('urgent',sec<=10);let b=document.getElementById('timerStart');if(b)b.textContent=timer.running?'一時停止':'▶ スタート';}
function startPause(){if(timer.running){timer.remaining=Math.max(0,timer.deadline-Date.now());timer.running=false;clearInterval(timer.handle);timer.handle=null;}else{if(timer.remaining<=0)resetTimer();timer.running=true;timer.deadline=Date.now()+timer.remaining;timer.handle=setInterval(()=>{timer.remaining=Math.max(0,timer.deadline-Date.now());updateTimer();if(timer.remaining<=0){timer.running=false;clearInterval(timer.handle);timer.handle=null;sound(250,.7,'sawtooth');}},100)}updateTimer()}
const button=(text,act,variant='')=>`<button class="btn ${variant}" data-action="${act}">${text}</button>`;
function scoreboard(){return `<section class="card scoreboard"><div class="head"><h2 class="section-title" style="margin:0">🏆 世界ランキング</h2><span class="pill">LIVE</span></div><div class="scorelist">${order().map((r,k)=>`<div class="scoreitem"><div class="ranknum">${k+1}</div><div class="team-name">${h(r.name)}</div><div><span class="score">${r.v}</span><span class="scoreunit">pt</span></div></div>`).join('')}</div><p class="side-note">順位はリアルタイム更新。得点はこの端末に自動保存されます。</p><div class="feature" style="margin-bottom:0"><h3>✏️ チーム名を変更</h3>${s.names.map((name,i)=>`<div class="team-edit" style="margin:7px 0"><span style="font-size:13px;width:20px">${i+1}</span><input maxlength="22" data-name="${i}" value="${h(name)}" aria-label="チーム${i+1}の名前"></div>`).join('')}</div></section>`}
function timerPanel(){return `<section class="card"><h2 class="section-title">⏱️ 番組タイマー</h2><div id="timerDigits" class="timer-number">01:00</div><div class="row">${button('▶ スタート','timer','primary')}${button('↺ 戻す','timerReset')}</div><p class="side-note">秒数を選んでからスタート</p><div class="timer-preset">${[5,15,30,60,90,180,300,600].map(n=>`<button class="btn ${timer.seconds===n?'primary':''}" data-action="preset" data-seconds="${n}">${n<60?n+'秒':n/60+'分'}</button>`).join('')}</div></section>`}
function howTo(){return `<section class="card"><h2 class="section-title">📋 司会のコツ</h2><p class="side-note">① 競技の説明を読む → ② お題を出す → ③ 記録を取り順位をタップ → ④ 「得点を確定」を押す。競技を飛ばしてもOK。</p><p class="side-note" style="margin-bottom:0">紙・ペン・紙コップ・スマホだけで開催可能。点数はいつでも修正できます。</p></section>`}
function intro(){return `<div class="stage-header"><div><span class="pill">OPENING CEREMONY / 8分</span><h2>地球で一番どうでもいい<br>戦いが、今始まる。</h2></div></div><p class="lead">競技は全部くだらない。でも勝負は本気！3チームで7つの競技を戦い、栄光の世界王者を決定します。</p><div class="feature"><h3>🎙️ 司会者の開会宣言</h3><p>「皆さん、ようこそ！今日ここに集まったのは、選ばれし世界の精鋭たちです！ただし競うのは、今後の人生に一切役立たない能力！それでは、サイ校・おバカ世界選手権……開幕！！」</p></div><div class="rulegrid"><div class="feature"><h3>✅ 基本ルール</h3><p>2人×3チーム想定。全6通常競技は1位5点・2位3点・3位1点。途中の裁判は特別採点、最終競技は順位点が2倍！</p></div><div class="feature"><h3>🧰 準備物</h3><p>A4用紙30枚ほど、ペン、紙コップ3個、スマホのタイマー。紙飛行機やボールは紙で作れます。</p></div></div><p class="alert">発言や動作が難しい人は、回答カードを指さす・チームメイトと役割分担する・スタッフに代読してもらう方法でも参加OK。失敗や苦手なことを笑うのではなく、状況のバカバカしさを楽しもう！</p>`}
function promptPanel(id){let idx=promptIndex(id),items=prompts[id]||[],p=items[idx]||[];return `<div class="prompt"><div class="prompt-kicker">🎯 本番のお題</div><div class="prompt-text">${p.map(line=>`<div>${h(line)}</div>`).join('')}</div><div class="prompt-controls">${button('← 前','promptPrev','small')}${button('次のお題 →','promptNext','small primary')}<span class="prompt-counter">${idx+1} / ${items.length}</span></div></div>`}
const descriptions={
 sync:{lead:'相方と相談せず、AかBを同時に回答！チームの脳みそはつながっているのか？',rule:['各チーム2人でA/Bを選び、せーので同時に発表。','全10問から8問程度実施。チームごとの「一致した回数」を数える。','一致数が多い順に1位〜3位を決定。発言が難しければ指差しや紙にA/BでもOK。'],tip:'タイミングをずらして答えが見えないようにするのがポイント。'},
 shop:{lead:'ただの紙コップを100万円の商品として売り込め！ムチャクチャな宣伝を真顔で！',rule:['各チーム30秒のテレビ通販PR。2人で分担してもOK。','必須ワードを1語言えたら1点（最大3点）。30秒以内に終えたら1点。','獲得した課題点が多い順で順位付け。同点なら司会が「説得力があった方」を決める。'],tip:'商品は紙コップで統一！別のお題は予備として使えます。'},
 gesture:{lead:'声がなくなった世界。ジェスチャーだけで超変な状況を伝えよ！',rule:['2人1組で出題者と回答者を担当。声や文字は使用禁止。','各チーム60秒で、正解したお題の個数を競う。パスOK。','同数なら追加1問の決定戦。動きが難しければ絵で伝える方式も選べます。'],tip:'出題者だけ画面を見てお題を確認し、回答者には画面を見せないでね。'},
 tower:{lead:'世界的な建設会社の資材が、A4用紙3枚だけになりました。地球一高いビルを作れ！',rule:['各チームA4用紙3枚だけ配布。テープ・ハサミ・机への固定はNG。','制限時間5分。自由に折ったり丸めたりしてOK。','机の上で10秒自立した高さを定規・A4の長辺（29.7cm）などで比較。高い順に順位。'],tip:'差がわずかならA4紙の長辺を基準にして概算でOK。'},
 press:{lead:'絶体絶命の記者会見！ただし「はい・いいえ・わかりません」を言ったらアウト！',rule:['各チーム交互に、記者の質問へ5秒以内に答える。','「はい」「いいえ」「わかりません」を使ったら失敗。発言以外の表現でも可。','各チーム同じ6問を実施。成功数の多い順に順位。'],tip:'司会者は鋭い顔で質問！答えが面白くても基準は「禁止語なし＆5秒以内」のみ。'},
 toss:{lead:'ついに迎えた人類最後の一投！くだらない世界の王者が決まる！',rule:['紙を丸めた柔らかいボールを作る。床にA4用紙3枚を的として並べる。','近い的1点・真ん中3点・遠い的5点。各チーム3投（メンバーで交代可）。','3投合計が多い順に順位付け。この競技のみ1位10点・2位6点・3位2点！'],tip:'安全のため投球ラインから床に向かって投げる。転倒しないよう立位が難しければ着席OK。'}
};
function regular(id){let d=descriptions[id],ps=s.ranks?.[id]||[0,0,0],isFinal=id==='toss',confirmed=!!s.awards[id],weights=isFinal?[0,10,6,2]:[0,5,3,1];return `<div class="stage-header"><div><span class="pill">競技 / ${stage().min}分 ${isFinal?'🔥 最終戦・2倍':''}</span><h2>${h(stage().sub)}</h2></div></div><p class="lead">${h(d.lead)}</p><div class="feature"><h3>📢 ルール説明（このまま読み上げOK）</h3><ol>${d.rule.map(x=>`<li>${h(x)}</li>`).join('')}</ol></div>${id==='tower'?`<div class="prompt"><div class="prompt-kicker">✂️ 建築資材</div><div class="prompt-text">A4用紙3枚 ／ 制限時間5分 ／ 10秒自立</div></div>`:id==='toss'?`<div class="prompt"><div class="prompt-kicker">🏹 得点表</div><div class="prompt-text">近い的 1pt ／ 中央 3pt ／ 遠い的 5pt<br>3投の合計で決着！</div></div>`:promptPanel(id)}<p class="side-note">💡 ${h(d.tip)}</p><div class="scoring"><div class="between row"><h3 class="section-title" style="margin:0">🥇 順位を選んで得点登録</h3><span class="pill">${confirmed?'✅ 登録済み・修正可能':'未登録'}</span></div><p class="side-note">各チームの順位をタップ。同点なら同順位にしてOK。${isFinal?'最終戦は2倍得点！':''}</p><div class="rank-grid">${s.names.map((name,i)=>`<div class="rank-team"><span class="team-name">${h(name)}</span><div class="rank-choice">${[1,2,3].map(r=>`<button class="rank-btn ${ps[i]===r?'selected':''}" data-action="rank" data-team="${i}" data-rank="${r}" aria-pressed="${ps[i]===r}">${r}位</button>`).join('')}</div><div class="preview">${ps[i]?'獲得 '+weights[ps[i]]+' pt':'順位未選択'}</div></div>`).join('')}</div><div class="btn-row">${button(confirmed?'💾 得点を修正して保存':'✅ 得点を確定','confirmScore','primary')}${confirmed?button('採点を取り消す','clearScore','danger'):''}</div></div>`}
function court(){let earned=[0,0,0],done=s.courtWinners.filter(v=>v!==null).length;return `<div class="stage-header"><div><span class="pill">特別競技・22分 / SPECIAL TRIAL</span><h2>⚖️ サイ校<br>どうでもよすぎる裁判所</h2></div></div><p class="lead">どうでもいい事件を、3チームが本気で裁く！検察・弁護・裁判官を事件ごとに交代。全員に出番がある公平な裁判です。</p><div class="feature"><h3>📖 裁判の仕組み</h3><p>全6事件。1事件につき検察60秒 → 弁護60秒 → 新証拠発表 → 裁判官チームが判決。勝訴チーム3点・敗訴チーム1点・裁判官チーム2点。全チームが各役を2回ずつ担当！</p></div>${courtCases.map((c,k)=>{const a=k%3,b=(k+1)%3,j=(k+2)%3,win=s.courtWinners[k];if(win!==null){earned[win]+=3;earned[win===a?b:a]+=1;earned[j]+=2}return `<div class="feature"><h3>事件 ${k+1}：${h(c.title)} ${win!==null?'✅':''}</h3><p style="font-weight:900;font-size:18px;margin:8px 0 13px">${h(c.charge)}</p><div class="verdict-case"><div class="rolebox"><small>👨‍💼 検察</small><strong>${h(s.names[a])}</strong><small>${h(c.pro)}</small></div><div class="rolebox"><small>🛡️ 弁護</small><strong>${h(s.names[b])}</strong><small>${h(c.def)}</small></div><div class="rolebox"><small>⚖️ 裁判官</small><strong>${h(s.names[j])}</strong><small>どちらが勝ちか判決</small></div></div><div class="feature evidencebox"><h3>📁 突然の新証拠</h3>${s.evidenceShown?.[k]?`<p class="evidence-text">${h(c.evidence)}</p>`:`<p class="side-note">検察と弁護の主張が出そろったら押してね！</p>`}<button class="btn small ${s.evidenceShown?.[k]?'ghost':'primary'}" data-action="evidence" data-case="${k}">${s.evidenceShown?.[k]?'↺ 証拠を隠す':'⚡ 新証拠を発表！'}</button></div><div class="courtbuttons"><button class="btn ${win===a?'selected':''}" data-action="verdict" data-case="${k}" data-winner="${a}">検察の勝ち！</button><button class="btn ${win===b?'selected':''}" data-action="verdict" data-case="${k}" data-winner="${b}">弁護の勝ち！</button>${win!==null?`<button class="btn ghost" data-action="verdictClear" data-case="${k}">撤回</button>`:''}</div></div>`}).join('')}<div class="scoring"><h3 class="section-title">裁判のポイント</h3><div class="rulegrid">${s.names.map((n,i)=>`<div class="feature" style="margin:0"><div class="muted">${h(n)}</div><strong style="font-size:29px;color:var(--lime)">${earned[i]}点</strong></div>`).join('')}</div><div class="btn-row">${button(done===6?(s.awards.court?'判決を修正して保存':'全判決を確定！'):`判決 ${done}/6 件`, 'confirmCourt',done===6?'primary':'')} ${s.awards.court?button('裁判得点を取り消す','clearScore','danger'):''}</div><p class="side-note">判決はいつでも変更できます。全6事件の判決が出てから登録してください。</p></div>`}
function awards(){const ranked=order(),first=ranked[0],ties=ranked.filter(x=>x.v===first.v);return `<div class="winner"><div class="eyebrow">THE GRAND FINALE</div><div class="cup">🏆</div><div class="sticker">第1回 世界王者</div><h2>${h(ties.map(t=>t.name).join(' ＆ '))}</h2><p>おめでとう！世界一くだらない偉業を達成！</p><div class="winboard">${ranked.map((t,i)=>`<div class="winrow"><span>${i+1}位　${h(t.name)}</span><span>${t.v} pt</span></div>`).join('')}</div><div class="btn-row" style="justify-content:center">${button('🎉 優勝ファンファーレ','fanfare','primary')}${button('印刷 / PDF保存','print')}</div></div><div class="feature"><h3>🎙️ 表彰式・司会のセリフ</h3><p>「世界中のどこを探しても、こんな能力のために本気になった皆さんはいません。ですが、本気は世界を変えます！本日の世界王者は……${h(ties.map(t=>t.name).join('、'))}！優勝おめでとうございます！！」</p></div>`}
function breakContent(){return `<div class="breakbig"><span>🍵</span><h2>国際休戦協定</h2><p>ここで10分休憩！世界中の選手たちに休息が与えられました。</p><p>水分補給、トイレ、深呼吸。後半にはあの裁判所が待っている……。</p></div>`}
function mainContent(){switch(stage().id){case'intro':return intro();case'court':return court();case'break':return breakContent();case'awards':return awards();default:return regular(stage().id)}}
function render({keepScroll=true}={}){const sy=window.scrollY,sc=points(),total=STAGES.reduce((v,x)=>v+x.min,0),elapsed=STAGES.slice(0,s.stage).reduce((v,x)=>v+x.min,0);document.getElementById('root').innerHTML=`<div class="app"><header class="top"><a href="#" class="brand" data-action="home"><div class="seal">祭</div><div><small>SAIKO SUPER GRAND PRIX</small><strong>サイ校・おバカ世界選手権</strong></div></a><div class="tools">${button(s.muted?'🔇 消音中':'🔊 効果音','sound','small')}${button('⛶ 全画面','fullscreen','small')}${button('⚙ リセット','reset','small ghost')}</div></header><section class="hero"><span class="sticker">爆笑 × ガチ勝負</span><div class="eyebrow" style="margin-top:21px">WORLD CHAMPIONSHIP / 2026</div><h1>その才能、<br><em>使い道なし。</em></h1><p class="desc">世界で一番どうでもいい戦いが、ここにある。<br>3チーム / 全7競技 / 120分。勝つのは誰だ？</p></section><nav class="timeline" aria-label="競技選択">${STAGES.map((x,i)=>`<button class="phase ${i===s.stage?'active':''} ${x.id!=='intro'&&x.id!=='break'&&x.id!=='awards'&&s.awards[x.id]?'done':''}" data-action="goto" data-stage="${i}" aria-current="${i===s.stage?'step':'false'}"><span class="number">${String(i+1).padStart(2,'0')}</span> ${h(x.label)} ${s.awards[x.id]?'✓':''}</button>`).join('')}</nav><div class="layout"><main class="main"><section class="card" id="stagecontent">${mainContent()}<div class="btn-row" style="justify-content:space-between;margin-top:23px;border-top:1px solid var(--line);padding-top:20px">${button('← 前のステージ','back','ghost')}${s.stage<STAGES.length-1?button('次のステージへ →','next','primary'):button('最初に戻る','home','primary')}</div><div class="muted" style="text-align:right;margin-top:11px;font-size:12px">目安：ここまで${elapsed+stage().min}分 / 全${total}分</div></section></main><aside class="side">${scoreboard()}${timerPanel()}${howTo()}</aside></div><footer class="footer">SAIKO WORLD GRAND PRIX © 2026 · 無料・広告なし・端末内に自動保存 · オフラインで遊べます</footer></div>`;timer.remaining=timer.remaining||timer.seconds*1000;updateTimer();if(keepScroll)window.scrollTo({top:sy,behavior:'instant'});}
function navigate(n){s.stage=Math.min(Math.max(n,0),STAGES.length-1);persist();resetTimer(STAGES[s.stage].timer||60);render({keepScroll:false});window.scrollTo(0,0);if(s.stage===STAGES.length-1)fanfare()}
function confirmScore(){const id=stage().id,r=s.ranks[id]||[0,0,0];if(r.some(x=>![1,2,3].includes(x))){alert('3チームすべての順位を選んでね！');return}const w=id==='toss'?[0,10,6,2]:[0,5,3,1];s.awards[id]=r.map(x=>w[x]);persist();sound(820,.21,'triangle');render();}
function courtPoints(){const scores=[0,0,0];s.courtWinners.forEach((v,k)=>{if(v===null)return;const a=k%3,b=(k+1)%3,j=(k+2)%3;scores[v]+=3;scores[v===a?b:a]+=1;scores[j]+=2});return scores}
function click(e){const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.tagName==='A')e.preventDefault();const ac=btn.dataset.action,id=stage().id;switch(ac){case'home':navigate(0);break;case'next':navigate(s.stage+1);break;case'back':navigate(s.stage-1);break;case'goto':navigate(+btn.dataset.stage);break;case'promptNext':s.prompt[id]=(promptIndex(id)+1)%(prompts[id].length);persist();render();break;case'promptPrev':s.prompt[id]=(promptIndex(id)-1+prompts[id].length)%(prompts[id].length);persist();render();break;case'rank':s.ranks[id]||=[0,0,0];s.ranks[id][+btn.dataset.team]=+btn.dataset.rank;persist();render();break;case'confirmScore':confirmScore();break;case'clearScore':if(confirm('この競技の得点を取り消す？')){delete s.awards[id];persist();render()}break;case'evidence':s.evidenceShown[+btn.dataset.case]=!s.evidenceShown[+btn.dataset.case];persist();if(s.evidenceShown[+btn.dataset.case])sound(840,.2,'square');render();break;case'verdict':s.courtWinners[+btn.dataset.case]=+btn.dataset.winner;persist();sound(370,.16,'square');render();break;case'verdictClear':s.courtWinners[+btn.dataset.case]=null;persist();render();break;case'confirmCourt':if(s.courtWinners.some(x=>x===null)){alert('6件の事件すべてで判決を決めてね！');return}s.awards.court=courtPoints();persist();sound(820,.25,'triangle');render();break;case'timer':startPause();break;case'timerReset':resetTimer(timer.seconds);render();break;case'preset':resetTimer(+btn.dataset.seconds);render();break;case'sound':s.muted=!s.muted;persist();sound();render();break;case'fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>alert('このブラウザでは全画面にできません'))}else document.exitFullscreen?.();break;case'fanfare':fanfare();break;case'print':window.print();break;case'reset':if(confirm('全競技の得点・名前・進行を消して最初からやり直しますか？\nこの操作は取り消せません。')){s=base();persist();navigate(0)}break;}}
document.addEventListener('click',click);document.addEventListener('change',e=>{let i=e.target.dataset?.name;if(i!==undefined){s.names[+i]=e.target.value.trim().slice(0,22)||`チーム${+i+1}`;persist();render()}});
resetTimer(60);render();
})();
</script>
</body></html>
